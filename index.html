<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트데이 이벤트</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Apple SD Gothic Neo", sans-serif;
}

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: url('bg.jpg') no-repeat center top;
  background-size: contain;   /* ⭐ 사진 잘리게 안함 */
  background-color: black;    /* 위아래 여백은 블랙 */
}

/* 위쪽 여백 (사진 잘 보이게) */
.top-space {
  flex: 1;
}

/* 하단 카드 */
.card {
  background: rgba(255,255,255,0.95);
  border-radius: 30px 30px 0 0;
  padding: 40px 25px;
  text-align: center;
}

.card h1 {
  font-size: 22px;
  margin-bottom: 30px;
  line-height: 1.5;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  border-radius: 30px;
  cursor: pointer;
}

.yes {
  background-color: #ff4d6d;
  color: white;
}

.no {
  background-color: #ccc;
}

.footer-text {
  margin-top: 25px;
  font-size: 18px;
  color: #ff4d6d;
}
</style>
</head>

<body>

<div class="top-space"></div>

<div class="card">
  <h1>
    발렌타인데이는 못했는데<br>
    화이트데이에 데이트 하자
  </h1>

  <div class="buttons">
    <button class="yes">Yes</button>
    <button class="no">No</button>
  </div>

  <div class="footer-text">
    ❤️ 데이트확정 애들부르면 죽어 ❤️
  </div>
</div>

</body>
</html>
