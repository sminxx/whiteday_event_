<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트데이 이벤트</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Apple SD Gothic Neo", sans-serif;
}

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: black;
}

/* 위쪽 배경 */
.top-image {
  flex: 1;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center top;
}

/* 아래 카드 */
.card {
  background: rgba(255,255,255,0.95);
  border-radius: 30px 30px 0 0;
  padding: 40px 25px;
  text-align: center;
  position: relative;
}

.card h1 {
  font-size: 22px;
  margin-bottom: 30px;
  line-height: 1.5;
}

.buttons {
  position: relative;
  height: 100px;
}

button {
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  transition: 0.2s;
}

.yes {
  background-color: #ff4d6d;
  color: white;
  left: 20%;
}

.no {
  background-color: #ccc;
  left: 55%;
}

.footer-text {
  margin-top: 40px;
  font-size: 18px;
  color: #ff4d6d;
}
</style>
</head>

<body>

<div class="top-image" id="bgImage"></div>

<div class="card">
  <h1 id="mainText">
    발렌타인데이는 못했는데<br>
    화이트데이에 데이트 하자
  </h1>

  <div class="buttons">
    <button class="yes" onclick="goNext()">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <div class="footer-text" id="footerText">
    ❤️ 버튼 눌러봐 ❤️
  </div>
</div>

<script>
let page = 1;

const bgImage = document.getElementById("bgImage");
const mainText = document.getElementById("mainText");
const footerText = document.getElementById("footerText");
const noBtn = document.getElementById("noBtn");

/* 첫 화면 이미지 (수정하지 않음) */
bgImage.style.backgroundImage = "url('01_new.jpg')";

/* YES 누르면 다음 페이지 */
function goNext() {
  if(page === 1) {
    page = 2;
    bgImage.style.backgroundImage = "url('02_new.jpg')";
    mainText.innerHTML = "진짜로?";
    footerText.innerHTML = "❤️ 애들 부르면 죽음 ❤️";
  } else {
    alert("데이트 확정 ❤️");
  }
}

/* NO 버튼 누를 때마다 계속 도망 */
function moveNoButton(e) {
  e.preventDefault();
  const x = Math.random() * 300 - 150;
  const y = Math.random() * 120 - 60;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("click", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);
</script>

</body>
</html>
