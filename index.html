<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트데이 이벤트</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Apple SD Gothic Neo", sans-serif;
}

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: black;
}

/* 🔥 위쪽 배경 이미지 */
.top-image {
  flex: 1;
  background: url('bg.jpg') no-repeat center top;
  background-size: contain;  /* 잘리지 않게 */
}

/* 🔥 아래 팝업 카드 */
.card {
  background: rgba(255,255,255,0.95);
  border-radius: 30px 30px 0 0;
  padding: 40px 25px;
  text-align: center;
  position: relative;
}

.card h1 {
  font-size: 22px;
  margin-bottom: 30px;
  line-height: 1.5;
}

.buttons {
  position: relative;
  height: 70px;
}

button {
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  transition: 0.2s;
}

.yes {
  background-color: #ff4d6d;
  color: white;
  left: 20%;
}

.no {
  background-color: #ccc;
  left: 55%;
}

.footer-text {
  margin-top: 40px;
  font-size: 18px;
  color: #ff4d6d;
}
</style>
</head>

<body>

<div class="top-image"></div>

<div class="card">
  <h1>
    발렌타인데이는 못했는데<br>
    화이트데이에 데이트 하자
  </h1>

  <div class="buttons">
    <button class="yes" onclick="alert('데이트 확정 ❤️')">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>

  <div class="footer-text">
    ❤️ 데이트확정 애들부르면 죽어 ❤️
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {
  const x = Math.random() * 200;
  const y = Math.random() * 40;
  noBtn.style.transform = `translate(${x}px, ${-y}px)`;
});
</script>

</body>
</html>
